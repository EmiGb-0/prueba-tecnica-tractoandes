name: tractoandes

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: tractoandes
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tractoandes_local_only}
            POSTGRES_DB: tractoandes
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U tractoandes -d tractoandes']
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - '127.0.0.1:5433:5432'

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: '3001'
            DATABASE_URL: postgres://tractoandes:${POSTGRES_PASSWORD:-tractoandes_local_only}@db:5432/tractoandes
        ports:
            - '3001:3001'
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        restart: unless-stopped
        environment:
            NODE_ENV: production
            API_INTERNAL_URL: http://api:3001
        ports:
            - '3000:3000'
        depends_on:
            api:
                condition: service_healthy

volumes:
    postgres_data:
